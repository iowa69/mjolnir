{% set name = "mjolnir-myco" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - mjolnir = mjolnir.cli:main
  # Bioconda requires this on every recipe, noarch included.
  run_exports:
    - {{ pin_subpackage(name, max_pin="x") }}

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=77
  run:
    - python >=3.9
    - pandas >=1.3
    - numpy >=1.20
    # The WHO catalogue is distributed only as .xlsx; the repo's .txt master file
    # is missing Streptomycin entirely and four genes with it, so openpyxl is a
    # hard requirement of resistance calling, not an optional convenience.
    - openpyxl >=3.0
    # Optional in pyproject, installed here because a conda user who asked for
    # the whole tool should get the whole tool: pysam for the pileups behind the
    # barcode and allele-fraction work, scipy for cohort clustering, reportlab
    # and matplotlib for the PDF. Without them those stages raise MjolnirError
    # naming the missing package rather than degrading quietly.
    - pysam >=0.19
    - scipy >=1.7
    - reportlab >=3.6
    - matplotlib-base >=3.5
    # PyYAML is optional to Mjolnir - agent/observation.py falls back to a strict
    # subset reader that raises rather than guessing - but conda can afford the
    # real parser, so the playbooks are read by the parser they were written for.
    - pyyaml >=5.1
    # The external tools the pipeline actually shells out to. Absent any of
    # these, `mjolnir doctor` names the capability that is lost; present, they
    # are what the run needs.
    - bwa-mem2 >=2.2          # Illumina mapping; plain `bwa` is an accepted fallback
    - minimap2 >=2.24         # ONT mapping (-x map-ont) and the ANI/assembly paths
    - samtools >=1.15         # sort, index, mpileup
    - bcftools >=1.15         # Illumina calling, and the ONT fallback caller
    - freebayes >=1.3         # the alternative Illumina caller (--caller freebayes)
    - mash >=2.3              # fast first-pass species screen
    - skani >=0.2             # ANI-based species identification (design §6)
    - seqkit >=2.3            # FASTA/FASTQ inspection and subsetting
    # Deliberately not run dependencies:
    #   clair3  - preferred ONT caller, but it drags in a full PyTorch stack.
    #             Install it alongside (`conda install clair3`); without it ONT
    #             calling falls back to bcftools and the report says so.
    #   kraken2 - only useful with a mycobacterial pangenome index. With a
    #             standard/PlusPF index the screen is uninformative for
    #             mycobacteria (measured M. tuberculosis sensitivity 0.0731), so
    #             Mjolnir refuses to present it as a clean result and does not
    #             pull the tool in by default.

test:
  # Every module, not just the packages: a missing submodule imports fine through
  # its package and fails at the first run that needs it.
  imports:
    - mjolnir
    - mjolnir.__main__
    - mjolnir.cli
    - mjolnir.config
    - mjolnir.doctor
    - mjolnir.pipeline
    - mjolnir.records
    - mjolnir.seqio
    - mjolnir.shell
    - mjolnir.utils
    - mjolnir.agent
    - mjolnir.agent.client
    - mjolnir.agent.discipline
    - mjolnir.agent.observation
    - mjolnir.cohort
    - mjolnir.cohort.cluster
    - mjolnir.cohort.distance
    - mjolnir.cohort.joint
    - mjolnir.contamination
    - mjolnir.contamination.heterozygosity
    - mjolnir.contamination.purity
    - mjolnir.db
    - mjolnir.db.fetch
    - mjolnir.db.registry
    - mjolnir.engines
    - mjolnir.engines.call
    - mjolnir.engines.depth
    - mjolnir.engines.map
    - mjolnir.engines.pileup
    - mjolnir.report
    - mjolnir.report.html
    - mjolnir.report.pdf
    - mjolnir.report.tables
    - mjolnir.resistance
    - mjolnir.resistance.catalogues
    - mjolnir.resistance.consensus
    - mjolnir.resistance.normalise
    - mjolnir.resistance.ntm
    - mjolnir.resistance.rules
    - mjolnir.typing
    - mjolnir.typing.lineage
    - mjolnir.typing.species
  commands:
    - mjolnir --version
    - mjolnir --help
    - mjolnir run --help
    - mjolnir cohort --help
    - mjolnir report --help
    - mjolnir db --help
    - mjolnir doctor --help
    # These work on a machine with no databases installed - they describe the
    # registry, they do not read the files - so they belong in a package test.
    - mjolnir db list
    - mjolnir db info tbdb who-catalogue-v2
    # doctor must fail on a machine with no databases. Exit 0 here would mean it
    # is not checking what it claims to check, which is worse than not shipping
    # it: an operator would read "fine" off a machine that cannot call anything.
    - if mjolnir doctor --no-llm; then echo "doctor exited 0 with no databases installed"; exit 1; fi
    # The agent playbooks carry the organism-specific reading. A wheel that ships
    # none of them runs with no organism knowledge, and a missing directory is
    # indistinguishable from an organism that simply has no playbook.
    - python -c "from mjolnir.agent.observation import PLAYBOOK_DIR; names = sorted(p.name for p in PLAYBOOK_DIR.glob('*.yaml')); assert names == ['mtbc.yaml', 'ntm.yaml'], names"
    - python -c "from mjolnir.agent.observation import playbook_named; assert playbook_named('mtbc').name; assert playbook_named('ntm').name"
    # Every threshold reaches the report with a source attached. An unsourced
    # number in the logic is the failure this project exists to avoid.
    - python -c "from mjolnir import config; assert config.THRESHOLDS; missing = [t.name for t in config.all_thresholds() if not t.source.strip()]; assert not missing, missing"
    # The WHO grade strings are numeric-prefixed with a spaced ASCII hyphen. The
    # PDF prints an en-dash form; a build that picked up the PDF spelling would
    # match nothing in the catalogue and silently report no resistance.
    - python -c "from mjolnir import config; assert '2) Assoc w R - Interim' in config.WHO_GRADES; assert config.WHO_GRADE_TO_CALL['1) Assoc w R'] == 'R'"
    # The database registry is what the report prints licences and checksums
    # from; losing a member here loses a column of the consensus.
    - python -c "from mjolnir.db.registry import DATABASES, DB_GROUPS; assert {'who-catalogue-v2', 'tbdb', 'mtbseq-resistance', 'h37rv'} <= set(DATABASES); assert 'catalogues' in DB_GROUPS"
    # The external tools Mjolnir shells out to, so a broken environment fails
    # here rather than four stages into someone's first run.
    - bwa-mem2 version
    - minimap2 --version
    - samtools --version
    - bcftools --version
    - freebayes --version
    - mash --version
    - skani -V
    - seqkit version

about:
  home: https://github.com/iowa69/mjolnir
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Resistance, lineage, species and contamination calling for MTBC and non-tuberculous mycobacteria
  description: |
    Mjolnir answers, in one command and one report, the four questions asked of
    a mycobacterial isolate: what is it, is it resistant, is it contaminated,
    and is it part of an outbreak. It takes Illumina paired-end reads, ONT reads
    or an assembly, and covers the M. tuberculosis complex and non-tuberculous
    mycobacteria with NTM as a first-class organism rather than a reference
    swap.

    Resistance is called from three catalogues independently - the WHO catalogue
    of mutations, 2nd edition, MTBseq's resistance-mediating lists, and tbdb -
    and then reconciled. WHO is the anchor, because it is the only source with a
    published, systematically derived grading; where WHO does not grade a
    variant and another catalogue calls it resistant, the drug is reported as
    "R (outside WHO catalogue)" rather than being silently dropped or presented
    as a WHO Group 1 call. Table lookup alone is not the catalogue, so the
    additional grading rules are implemented too: rpoB RRDR, loss of function in
    katG, pncA, Rv0678 and pepQ, the borderline rpoB mutations, and the mmpL5
    and eis epistasis suppressions, each stated in the report where it fired.
    NTM resistance - erm(41) sequevar typing, rrl 2058/2059, rrs 1408 - is
    implemented from the literature, with the supporting reference named beside
    every call.

    Species identification is ANI-based, never taxonomic read classification:
    the MTBC members are not at species rank in NCBI taxonomy, so a classifier
    row reading "M. bovis 3.2%" is not a species identification and Mjolnir will
    not print one. Within the complex, lineage comes from SNP barcodes read off
    a direct pileup, reported with barcode support - sites called over sites
    expected - because BCG and the animal lineages La2 and La3 rest on as few as
    five defining SNPs.

    Contamination is reported as a sample-validity verdict built from what can
    honestly be measured: heterozygosity at lineage-defining positions, the
    genome-wide heterozygous-SNP fraction, mapped fraction, coverage breadth and
    evenness, and the unambiguous-base fraction that MTBseq's majority rule
    discards. Absence of a call is reported as absence, never as
    susceptibility, and nothing unmeasured is described as fine.

    Cohort mode adds a joint variant table, masked pairwise SNP distances - each
    printed beside the number of shared callable sites that produced it - and
    clustering at a stated threshold whose basis is printed. Every threshold in
    the tool carries the document it came from, and the report names the version
    and checksum of every database it used.

    Output is a clinician-first PDF with research annexes behind it, the same
    content as self-contained HTML, and TSV/JSON for downstream code. A local
    LLM writes the prose over rule-derived verdicts and is discarded if it
    violates the discipline rules; with no model host reachable the tool runs
    unchanged and the report says the interpretation is rule-only.

    Reference databases are not vendored. `mjolnir db fetch` obtains them and
    records each one's version, checksum, licence and citation.
  doc_url: https://github.com/iowa69/mjolnir#readme
  dev_url: https://github.com/iowa69/mjolnir

extra:
  recipe-maintainers:
    - iowa69

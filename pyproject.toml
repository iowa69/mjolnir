[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mjolnir-myco"
version = "0.1.0"
description = "Mjolnir - resistance, lineage, species and contamination calling for the M. tuberculosis complex and non-tuberculous mycobacteria, from Illumina reads, ONT reads or assemblies"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{name = "Mjolnir developers"}]
keywords = [
    "tuberculosis",
    "mycobacteria",
    "antimicrobial resistance",
    "NTM",
    "lineage",
    "genomics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=1.3",
    "numpy>=1.20",
    # The WHO catalogue is distributed only as .xlsx - the repo's .txt master
    # file is missing a drug and four genes, so reading it is not optional.
    "openpyxl>=3.0",
]

[project.optional-dependencies]
reads = ["pysam>=0.19"]
cluster = ["scipy>=1.7"]
report = ["reportlab>=3.6", "matplotlib>=3.5"]
excel = ["openpyxl>=3.0"]
all = ["pysam>=0.19", "scipy>=1.7", "reportlab>=3.6", "matplotlib>=3.5", "openpyxl>=3.0"]

[project.scripts]
mjolnir = "mjolnir.cli:main"

[project.urls]
Homepage = "https://github.com/iowa69/mjolnir"
Documentation = "https://github.com/iowa69/mjolnir#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mjolnir = ["data/**/*"]
